services:
  postgres:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: gav
      POSTGRES_PASSWORD: gav
      POSTGRES_DB: gav
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gav -d gav"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in chat-events message-events reaction-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
    restart: "no"

  messenger-migrate:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: gav
    volumes:
      - ./messenger/migrations:/migrations:ro
    command:
      - sh
      - -c
      - for f in /migrations/*.sql; do psql -h postgres -U gav -d gav -f "$$f"; done
    restart: "no"

  social-db-init:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: gav
    command:
      - sh
      - -c
      - test "$$(psql -h postgres -U gav -d gav -tAc "SELECT 1 FROM pg_database WHERE datname='gav_social'")" = "1" || createdb -h postgres -U gav gav_social
    restart: "no"

  social-network:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: social_network
        COMMAND_PATH: ./cmd/api
    environment:
      HTTP_PORT: "8080"
      GRPC_ADDR: ":9000"
      POSTGRES_DSN: postgres://gav:gav@postgres:5432/gav_social?sslmode=disable
      JWT_SECRET: dev-secret-change-me
      JWT_TTL: 24h
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /uploads
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:19092
      KAFKA_CONSUMER_GROUP: gav-social-network
      FIREBASE_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      social-db-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - social-uploads:/uploads

  messenger:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: messenger
        COMMAND_PATH: ./cmd/grpc-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      messenger-migrate:
        condition: service_completed_successfully
      social-network:
        condition: service_started
    environment:
      POSTGRES_DSN: postgres://gav:gav@postgres:5432/gav?sslmode=disable
      REDIS_ADDR: redis:6379
      GRPC_ADDR: :9090
      HTTP_ADDR: :8082
      SOCIAL_NETWORK_ADDR: social-network:9000
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:19092
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8082:8082"
      - "9090:9090"

volumes:
  postgres-data:
  kafka-data:
  social-uploads:
